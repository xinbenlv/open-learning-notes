const lessons=[{"hash": "cover", "title": "费曼学习法讲解", "cues": ["“大家好，我是载哥。最近我想试试用费曼方法来学习：把东西讲出来，发现不懂的地方，补上，再讲得更简单。今天先聊聊这个方法。”"], "timings": [10000], "seconds": 10}, {"hash": "taiji", "title": "知行太极", "cues": ["“我想把这个学习过程画成一个太极。白色臂代表讲解：把理解输出出来，我用 1 表示。”", "“讲着讲着，发现自己还有不懂的地方。这就是白色里面的黑点：查缺，我用 0 表示。”", "“发现缺口，就推动我回去查证、学习，把知识补上。这是黑色臂：补漏，做加法。”", "“补完还不够。我还要去掉不必要的复杂表达，换成更通俗的解释。这是黑色里面的白点：简化，做减法。”", "“两臂是行动，两点是领悟。我把它叫作学习中的知行合一：讲解、查缺、补漏、简化，再讲一次。”"], "timings": [7500, 7500, 7500, 9000, 9000], "seconds": 40}, {"hash": "straw", "title": "吸管为什么能吸水", "cues": ["“上一集我们画了太极，这次拿吸管试试。我最初的解释是：因为我在吸，所以水上来了。先把这个解释说出来。”", "“等等，吸到底改变了什么？它怎么让水向上走？我发现自己只说出了现象，还没有解释原因。这就是查缺。”", "“查资料后，我补上了气压差：嘴包住吸管吸气，让嘴里和吸管上端的气压降低。杯子敞口，水面仍受大气压。这个压力差让水克服重力，沿吸管上升。”", "“再换成普通人能听懂的话：我让管子上面压力变小，外面的空气把水压上来。简化的是表达，保留的是原因。”", "“最后换个情况检验理解：吸管在水面上方漏气，为什么更难喝到？因为空气从漏口进入，原来的气压差更难维持。如果这个我也能讲清楚，就再走完了一次讲解、查缺、补漏、简化。”"], "timings": [8000, 9000, 13000, 11000, 12000], "seconds": 55}, {"hash": "benefits", "title": "费曼方法的作用", "cues": ["“第一，它能戳破我以为我懂了。读别人讲得很顺的解释，很容易把熟悉当成理解。自己讲到为什么必须这样时，才发现具体是哪一步接不上。这一项，是发现理解的缺口。”", "“第二，输出本身就是最强的记忆编码。这里强调的是输出对记忆的价值：自己组织解释，主动回忆，再自问为什么，让知识更容易留下来。生成、提取、自我解释，以及准备教别人，都可能帮助学习；效果也取决于具体做法。”", "“第三，逼你从结论退回到机制。它接着第一点：发现假懂之后，进一步追求真懂。例如磁盘友好不再只是一个标签，而要能解释为什么。理解了原因，才更有可能用到新问题。左边讲理解的深入，右边第二点讲这些理解在记忆中的留存。”", "“第四，校准元认知。第一点是这一次发现自己哪里没懂；经历多次这样的检验，第四点是以后更能判断自己到底懂到什么程度。第三点加深对知识的理解，第四点改善对自己理解程度的判断。”", "“第五，学习的副产品可以资产化。第二点是所学留在脑中，第五点是讲义和视频留在外部：可以发表、被人纠错，也可以持续更新。所以这五点有一条理解上的主线：戳破假懂、深入机制、校准判断；同时留下记忆和作品两种积累。”"], "timings": [15000, 18000, 20000, 16000, 18000], "seconds": 87}, {"hash": "limits", "title": "费曼方法的缺点与局限", "cues": ["“说完作用，也说说它的代价。第一是慢。讲清楚一个概念，需要整理、查证和修改。所以我会把它用在值得深入理解的核心问题上；快速了解一个领域时，可以先浏览，再挑重点讲。”", "“第二是流畅性陷阱。把一段话讲得很顺，不代表真的理解了。也可能只是把读来的解释重新演了一遍。假想的听众不会追问，所以自己讲得满意，还不够。”", "“因此，我想给讲解配上真实的质疑：一个会打断的听众，一个会问那如果呢的人，或者公开发布后有人指出错误。也要对照可靠资料和实际测试。费曼帮我讲清楚，苏格拉底式追问帮我继续检查理解。”"], "timings": [14000, 14000, 17000], "seconds": 45}, {"hash": "outro", "title": "谢谢观看，关注我", "cues": ["“谢谢你看到这里！如果你也对这种学习方式感兴趣，欢迎关注我，载哥硅谷笔记。”", "“接下来，我准备用这种方法，学习和讲解 100 个硅谷前沿技术与 AI 系统。”", "“同时，也想讲清楚 100 个生活里的趣味小常识，就像今天这根吸管。”", "“边学边讲，欢迎大家一起提问、讨论和纠正。一起把复杂的事讲明白，我们下次见！”"], "timings": [7000, 9000, 8000, 9000], "seconds": 33}, {"hash": "topics", "title": "Topic Wish List", "cues": ["“这是我的 Topic Wish List。算法方面，我想从两数之和、三数之和、一致性哈希、动态规划和二分查找开始，把看过的解法真正讲明白。”", "“软件系统方面，我想讲 REST API、HTTPS、JWT，以及常见的软件架构和分布式模式。都是经常接触，却值得再问一遍为什么的东西。”", "“AI 方面，从 Transformer、大语言模型、RAG 到 AI Agent，再到我特别想研究的 Agent Harness：怎么让 AI 持续、可靠地完成任务。”", "“生活趣味也一样：水库黑球、蓝色 LED、反向自行车、微波炉里的葡萄，还有猫在空中翻身。这些主题参考了屏幕下面的科普频道，我想自己学明白，再用自己的话讲给大家听。”"], "timings": [14000, 14000, 16000, 16000], "seconds": 60}];
function lessonFromHash(){return Math.max(0,lessons.findIndex(item=>'#'+item.hash===location.hash))}
let lesson=lessonFromHash();
let cues=lessons[lesson].cues;
let beats=[];
let step=0,timer=null,playing=false;
// Chinese remains the source of truth. Only text and local English metrics change.
let language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
const t = text => language === 'en' ? (english[text] ?? text) : text;
const svgText = [...document.querySelectorAll('.board text:not([id^="page-"])')].map(el => ({
  el, zh: el.textContent, size: el.getAttribute('font-size'), style: el.getAttribute('style'),
}));
const staticText = [];
const walker = document.createTreeWalker(document.querySelector('main'), NodeFilter.SHOW_TEXT);
while (walker.nextNode()) {
  const node = walker.currentNode;
  if (!node.parentElement.closest('svg text, script, style, #source-note') && node.textContent.trim()) {
    staticText.push({node, zh: node.textContent});
  }
}
const staticLabels = [...document.querySelectorAll('[aria-label], [title]')].flatMap(el =>
  ['aria-label', 'title'].filter(attr => el.hasAttribute(attr)).map(attr => ({el, attr, zh: el.getAttribute(attr)})));
const measure = document.createElement('canvas').getContext('2d');
function textWidth(text, size) {
  measure.font = `${size}px BoardHand`;
  return measure.measureText(text).width;
}
function englishWidth(el) {
  const slide = el.closest('svg').id, x = +el.getAttribute('x'), y = +el.getAttribute('y');
  if (el.getAttribute('text-anchor') === 'end') return x === 1164 ? 520 : 140;
  if (el.closest('.camera')) return 260;
  if (el.getAttribute('text-anchor') === 'middle') return 350;
  if (y < 100) return 600;
  if (slide === 'lesson-6') return x < 280 ? 210 : y >= 192 ? 205 : 900;
  if (slide === 'lesson-0') return 510;
  if (slide === 'lesson-1') {
    if (x < 100) return 220;
    if (x < 400) return 180;
    if (x > 950) return 255;
    return 760;
  }
  if (slide === 'lesson-2') {
    if (x < 100) return 220;
    if (y === 663) return 795;
    if (y === 168) return 875;
    if (x === 300 || x === 299) return 145;
    if (x < 800) return 355;
    if (x >= 1080) return 165;
    return 265;
  }
  if (slide === 'lesson-3') {
    if (x === 704) return 115;
    return x >= 830 ? 1215-x : 690-x;
  }
  if (slide === 'lesson-4') {
    if (y < 240 || y >= 600) return 900;
    if (y === 496 || y === 546) return 630;
    if (x === 991) return 175;
    return x < 790 ? 370 : 1215-x;
  }
  if (slide === 'lesson-5') {
    if (x < 100) return 210;
    if (y === 522) return x < 800 ? 410 : 395;
    if (y === 626) return 845;
    return 900;
  }
  return 1215-x;
}
function linesFor(text, size, width) {
  const lines = [''];
  for (const word of text.split(' ')) {
    const last = lines.length-1, candidate = lines[last] ? lines[last]+' '+word : word;
    if (lines[last] && textWidth(candidate, size) > width) lines.push(word);
    else lines[last] = candidate;
  }
  return lines;
}
function renderText(record, preserveAnimation=false) {
  const {el, zh} = record;
  const previous = preserveAnimation ? el.querySelector('.glyph')?.getAnimations()[0] : null;
  const elapsed = previous?.currentTime;
  const text = t(zh);
  if (record.style === null) el.removeAttribute('style'); else el.setAttribute('style', record.style);
  if (record.size === null) el.removeAttribute('font-size'); else el.setAttribute('font-size', record.size);
  let size = Number(record.size || 21), lines = [text];
  if (language === 'en') {
    const width = englishWidth(el);
    const topicQuestion = el.closest('svg').id === 'lesson-6' && record.size === '17' && +el.getAttribute('y') < 610 && zh !== 'Agent Harness';
    if (el.closest('svg').id === 'lesson-5' && zh === '硅谷前沿技术与 AI 系统') {
      size = 23; lines = ['Frontier Silicon Valley technologies', '& AI systems'];
    } else if (topicQuestion) {
      lines = linesFor(text, size, width);
      while (lines.length > 2) { size -= 0.5; lines = linesFor(text, size, width); }
    }
    else size = Math.min(size, size * width / Math.max(1, textWidth(text, size)));
    el.style.fontSize = `${size}px`;
  }
  el.replaceChildren();
  const animated = el.hasAttribute('data-write');
  if (!animated && lines.length === 1) { el.textContent = text; return; }
  const x = Number(el.getAttribute('x')), base = Number(el.dataset.delay || 0);
  const count = [...text].length;
  // English uses actual font advances and the same reveal window as its Chinese line.
  const interval = language === 'en' ? 85 * Math.max(0, [...zh].length-1) / Math.max(1, count-1) : 85;
  let index = 0;
  for (let line=0; line<lines.length; line++) {
    let offset = 0;
    for (const char of lines[line]) {
      const span = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      span.textContent = char;
      span.setAttribute('x', x+offset);
      if (language === 'en') span.setAttribute('y', Number(el.getAttribute('y'))+line*(el.closest('svg').id === 'lesson-5' ? 29 : 19));
      span.setAttribute('dy', String([0,-.3,.55,-.4,.15][index%5]));
      span.setAttribute('rotate', String([-.65,.45,-.2,.6,0][index%5]));
      if (animated) {
        span.classList.add('glyph');
        span.style.setProperty('--delay', `${base+index*interval}ms`);
      }
      el.append(span);
      offset += language === 'en' ? textWidth(char,size) : size*(char===' '?0.48:char==='='?0.7:1);
      index++;
    }
    if (line < lines.length-1) index++; // retain the space in the reveal timing
  }
  if (elapsed != null) el.getAnimations({subtree:true}).forEach(animation => { animation.currentTime = elapsed; });
}
function translateSource() {
  if (language !== 'en') return;
  const walk = document.createTreeWalker($('source-note'), NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) walk.currentNode.textContent = t(walk.currentNode.textContent);
}
function updateChrome() {
  $('language').textContent = language === 'zh' ? 'English' : '中文';
  $('language').setAttribute('aria-label', language === 'zh' ? 'Switch to English' : '切换到中文');
  $('language').setAttribute('lang', language === 'zh' ? 'en' : 'zh-CN');
  $('theme').textContent = t(document.body.classList.contains('dark') ? '换成白板' : '换成黑板');
  $('camera').textContent = t(document.body.classList.contains('hide-camera') ? '头像占位：关' : '头像占位：开');
  $('auto').textContent = t(playing ? '暂停试看' : '自动试看');
  $('next').textContent = t(step===cues.length-1 ? (lesson<lessons.length-1 ? '下一页 →' : '已到最后') : '下一步 →');
  $('cue').textContent = cues[step];
  $('duration').textContent = lesson===0 ? t('封面 · 按 → / N / 空格 开始') : language==='en' ? `${cues.length} beats · about ${lessons[lesson].seconds} seconds · pause with your narration` : `${cues.length} 拍 · 约 ${lessons[lesson].seconds} 秒 · 跟着你的讲述停顿`;
  document.title = t('把它讲明白')+' · '+t(lessons[lesson].title);
  [...$('dots').children].forEach((el,i) => el.setAttribute('aria-label', language==='en' ? `Go to beat ${i+1}` : `跳到第 ${i+1} 步`));
}
function applyLanguage(preserveAnimation=false) {
  document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
  staticText.forEach(({node,zh}) => { node.textContent = t(zh.trim()) === zh.trim() ? zh : zh.replace(zh.trim(), t(zh.trim())); });
  staticLabels.forEach(({el,attr,zh}) => el.setAttribute(attr,t(zh)));
  svgText.forEach(record => renderText(record,preserveAnimation));
  cues = language === 'en' ? englishCues[lesson] : lessons[lesson].cues;
  updateChrome();
}
function toggleLanguage() {
  language = language === 'zh' ? 'en' : 'zh';
  applyLanguage(true);
  // Refresh only the reference wording, without re-rendering the slide or touching its timer.
  renderSource();
  const url = new URL(location.href);
  url.searchParams.set('lang',language);
  history.replaceState(null,'',url);
}

function renderDots(){$('dots').replaceChildren();for(let i=0;i<cues.length;i++){const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`跳到第 ${i+1} 步`);b.addEventListener('click',()=>{stop();show(i)});$('dots').append(b)}}
function show(n,animate=true){step=Math.max(0,Math.min(n,cues.length-1));beats.forEach(el=>el.classList.remove('shown','old'));void $('board').getBoundingClientRect();beats.forEach(el=>{const i=Number(el.dataset.step);if(i<=step)el.classList.add('shown');if(i<step||(!animate&&i===step))el.classList.add('old')});$('cue').textContent=cues[step];$('page-'+lesson).textContent=`${String(step+1).padStart(2,'0')} / ${String(cues.length).padStart(2,'0')}`;$('prev').disabled=lesson===0&&step===0;$('next').disabled=lesson===lessons.length-1&&step===cues.length-1;updateChrome();[...$('dots').children].forEach((el,i)=>{el.classList.toggle('active',i===step);el.setAttribute('aria-current',i===step?'step':'false')});}
function stop(){clearTimeout(timer);timer=null;playing=false;$('auto').textContent=t('自动试看');$('auto').setAttribute('aria-pressed','false')}
function advance(){stop();if(step===cues.length-1){if(lesson<lessons.length-1)switchLesson(lesson+1);return}show(step+1)}
function retreat(){stop();if(step>0){show(step-1,false);return}if(lesson>0)switchLesson(lesson-1,true,lessons[lesson-1].cues.length-1,false)}
function schedule(){timer=setTimeout(()=>{if(step===cues.length-1){stop();return}show(step+1);schedule()},lessons[lesson].timings[step])}
function renderSource(){
 $('source-note').hidden=!['straw','benefits'].includes(lessons[lesson].hash);
 $('source-note').innerHTML=lessons[lesson].hash==='benefits'?'学习效果参考：<a href="https://www.sciencedirect.com/science/article/pii/S0361476X16000102" target="_blank" rel="noopener noreferrer">讲解与学习实验</a> · <a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2015.01054/full" target="_blank" rel="noopener noreferrer">主动回忆实验</a>':'物理解释核对：<a href="https://www.metlink.org/experiment_topic/air-pressure/" target="_blank" rel="noopener noreferrer">英国皇家气象学会 · Air Pressure（吸管实验）</a>';
 translateSource();
}
function switchLesson(n,updateHash=true,initialStep=0,animate=true){
 if(n<0||n>=lessons.length)return;
 stop();lesson=n;cues=language==='en'?englishCues[lesson]:lessons[lesson].cues;
 document.querySelectorAll('[data-step]').forEach(el=>el.classList.remove('shown','old'));
 lessons.forEach((item,i)=>{$('lesson-'+i).toggleAttribute('hidden',i!==lesson);});
 beats=[...$('lesson-'+lesson).querySelectorAll('[data-step]')];
 document.querySelectorAll('[data-lesson]').forEach(el=>{if(Number(el.dataset.lesson)===lesson)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
 renderSource();
 renderDots();
 if(updateHash)history.replaceState(null,'','#'+lessons[lesson].hash);
 show(initialStep,animate);
 if(document.body.classList.contains('recording'))$('board').focus();
}
 document.querySelectorAll('[data-lesson]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();switchLesson(Number(el.dataset.lesson))}));
 window.addEventListener('hashchange',()=>switchLesson(lessonFromHash(),false));
$('board').addEventListener('click',advance);$('next').onclick=advance;$('prev').onclick=retreat;$('replay').onclick=()=>{stop();show(step)};
$('auto').onclick=()=>{if(playing){stop();return}playing=true;$('auto').textContent=t('暂停试看');$('auto').setAttribute('aria-pressed','true');show(0);schedule()};
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('theme').textContent=t(dark?'换成白板':'换成黑板');$('theme').setAttribute('aria-pressed',String(dark))};
$('camera').onclick=()=>{const hide=document.body.classList.toggle('hide-camera');$('camera').textContent=t(`头像占位：${hide?'关':'开'}`);$('camera').setAttribute('aria-pressed',String(!hide))};
function record(){const active=document.body.classList.toggle('recording');if(active){$('board').focus();if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('record').onclick=record;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('recording')});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){document.body.classList.remove('recording');return}
 if(e.altKey||e.ctrlKey||e.metaKey||e.isComposing||e.repeat)return;
 if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;
 if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
 const key=e.key.toLowerCase();
 if([' ','arrowright','arrowleft','r','f','n','p','pagedown','pageup','l'].includes(key))e.preventDefault();
 if([' ','arrowright','n','pagedown'].includes(key)){advance();return}
 if(['arrowleft','p','pageup'].includes(key)){retreat();return}
 if(key==='r'){stop();show(step)}
 if(key==='f')record();
 if(key==='l')toggleLanguage();
 if(e.key==='Enter'&&e.target===$('board'))advance();
});
$('language').onclick=toggleLanguage;
// Load the actual handwriting font before measuring English advances.
document.fonts.load('24px BoardHand').catch(()=>[]).then(()=>document.fonts.ready).then(()=>{
 applyLanguage();
 switchLesson(lesson,false);
});

</script>
</body>
</html>
